<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spritesheet QA Viewer</title>
    <style>
        body { background: #18181b; color: #eee; font-family: monospace; margin: 0; padding: 16px; }
        h1 { font-size: 16px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
        .cell { background: #26262b; border: 1px solid #3a3a42; border-radius: 6px; padding: 8px; text-align: center; }
        .cell canvas { background: repeating-conic-gradient(#2a2a30 0% 25%, #222228 0% 50%) 0 0 / 16px 16px; image-rendering: pixelated; }
        .name { font-size: 11px; margin-top: 6px; word-break: break-all; }
        .name b { color: #ffd75a; }
        .note { color: #9aa; font-size: 12px; }
    </style>
</head>
<body>
    <h1>Spritesheet QA Viewer</h1>
    <p class="note" id="status">Loading assets/spritesheet.json + spritesheet.png…</p>
    <div class="grid" id="grid"></div>

    <script type="module">
        const status = document.getElementById("status");
        const grid = document.getElementById("grid");

        async function main() {
            const def = await (await fetch("/assets/spritesheet.json")).json();
            const img = new Image();
            img.onload = () => {
                status.textContent =
                    `Loaded ${Object.keys(def.frames).length} frames from ${def.meta.size.w}x${def.meta.size.h} sheet. ` +
                    `Hover/look for anything that isn't what its name says.`;
                render(def, img);
            };
            img.src = "/assets/spritesheet.png";
        }

        function render(def, img) {
            const S = 96; // max cell draw size
            for (const name of Object.keys(def.frames).sort()) {
                const f = def.frames[name];
                const s = f.scale || 1;
                const dw = Math.max(2, Math.round(f.frame.w * s));
                const dh = Math.max(2, Math.round(f.frame.h * s));
                const scale = Math.min(1, S / Math.max(dw, dh));
                const cell = document.createElement("div");
                cell.className = "cell";
                const canvas = document.createElement("canvas");
                canvas.width = Math.round(dw * scale);
                canvas.height = Math.round(dh * scale);
                const ctx = canvas.getContext("2d");
                ctx.imageSmoothingEnabled = false;
                ctx.drawImage(img, f.frame.x, f.frame.y, f.frame.w, f.frame.h,
                    0, 0, canvas.width, canvas.height);
                const label = document.createElement("div");
                label.className = "name";
                const [entity, state] = name.split(/_(?=\d+$)/);
                label.innerHTML = `<b>${entity}</b> ${state || ""}`;
                cell.appendChild(canvas);
                cell.appendChild(label);
                grid.appendChild(cell);
            }
        }

        main().catch(e => { status.textContent = "Error: " + e.message; });
    </script>
</body>
</html>
